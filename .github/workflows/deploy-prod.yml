name: Deploy kaiteki-web (production)

# Builds the revamped kaiteki site image, pushes it to Docker Hub, and deploys to
# BPVPS1 over Tailscale → kaiteki.my (+ www). The running compose file is owned by
# the infrastructure repo (vps/bpvps1/stacks/kaiteki/).
#
# This replaced the legacy kaiteki-main-old pipeline (that repo's deploy.yml was
# deleted on cutover); the `kaiteki` stack now runs blueprintagency/kaiteki-web:prod.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: blueprintagency/kaiteki-web

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # All blog media lives in R2, never in public/ (content/blog/AUTHORING.md
      # §3). Sync before the build so every cdn.kaiteki.my URL the site renders
      # is already serving. Credentials come from the repo's GitHub secrets and
      # variables; nothing about the bucket is hardcoded here.
      - name: Sync blog media to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 rejects the CRC32 trailer the AWS CLI v2 now sends by default.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          # No --delete: dropping a file from git must not 404 a URL already
          # indexed. --size-only because a git checkout has fresh mtimes on
          # every run, so the default comparison would re-upload everything.
          # ponytail: a same-size replacement won't re-upload; rename the file.
          aws s3 sync content/blog/media "s3://${{ vars.R2_BUCKET_NAME }}/blog" \
            --endpoint-url "https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --size-only --no-progress

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:prod
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.BPVPS1_TAILSCALE_HOST }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ vars.BPVPS1_TAILSCALE_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy on BPVPS1
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no \
            "deploy@${{ vars.BPVPS1_TAILSCALE_HOST }}" '
            set -e
            cd /root/stacks/kaiteki
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -af
          '
