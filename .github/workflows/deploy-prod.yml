name: Deploy kaiteki-web (production)

# Builds the revamped kaiteki site image, pushes it to Docker Hub, and deploys to
# BPVPS1 over Tailscale → kaiteki.my (+ www). The running compose file is owned by
# the infrastructure repo (vps/bpvps1/stacks/kaiteki/).
#
# This replaced the legacy kaiteki-main-old pipeline (that repo's deploy.yml was
# deleted on cutover); the `kaiteki` stack now runs blueprintagency/kaiteki-web:prod.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: blueprintagency/kaiteki-web

jobs:
  # Blog media lives in R2, and the CDN must be warm before the site that
  # references it goes live, so this gates the build rather than racing it.
  media:
    uses: ./.github/workflows/sync-blog-media.yml
    secrets: inherit

  # Work merges to main directly, so content-check.yml (pull requests only)
  # never runs on the way to production. These two guards run here instead,
  # on Node 24: the image itself is node:20 and cannot run them. A failure
  # stops the deploy and the live site stays on the previous version.
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No price in any "What affects the cost" block (docs/15 2.4).
      - run: pnpm check:cost
      # No cluster more templated than its recorded budget (docs/16).
      - run: pnpm check:sameness

  build-deploy:
    needs: [media, guards]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:prod
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.BPVPS1_TAILSCALE_HOST }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ vars.BPVPS1_TAILSCALE_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy on BPVPS1
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no \
            "deploy@${{ vars.BPVPS1_TAILSCALE_HOST }}" '
            set -e
            cd /root/stacks/kaiteki
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -af
          '
