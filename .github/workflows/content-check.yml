name: Content check

# Gate for content PRs (new /blog posts especially): the blog publishing
# contract, the types and lint. Deploy workflows only run on main, so this is
# what tells an author whether their post is safe to merge.
on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:blog
      # No price in any "What affects the cost" block (client decision
      # 2026-09-20, docs/15 2.4), and no cluster more templated than its
      # recorded budget (docs/16).
      - run: pnpm check:cost
      - run: pnpm check:sameness
      # --live HEADs every concern and treatment image. That media is uploaded
      # from a laptop, not by a workflow, so this is the only thing that catches
      # a page shipping URLs whose bytes were never synced to the bucket.
      - run: pnpm validate:concerns --live
      - run: pnpm typecheck
      - run: pnpm lint
      # main is the deploy branch, so a body that only breaks at render time
      # must fail here rather than on merge.
      - run: pnpm build
